# TWG51 - TWRP para Motorola Moto G51 5G (cypfq)
# Creado por Andrés Londero
#
# Al subir twg51.zip al repo:
#   1) "preparar": descomprime el zip, corre las pruebas, baja el firmware de
#      stock y completa el device tree (kernel, módulos táctiles, fstab).
#   2) "compilar": baja el código de TWRP 12.1 (manifiesto mínimo) y compila.
# El resultado (twrp-cypfq-*.img) queda en los artefactos y en un Release.

name: Compilar TWRP G51

on:
  push:
    paths:
      - 'twg51.zip'
  workflow_dispatch:

permissions:
  contents: write

env:
  RAMA_TWRP: twrp-12.1
  MANIFIESTO: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  DISPOSITIVO: cypfq
  RUTA_ARBOL: device/motorola/cypfq

jobs:
  preparar:
    name: Preparar árbol desde el firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Descomprimir twg51.zip
        run: |
          if [ -f twg51.zip ]; then
            unzip -o twg51.zip -d .
          else
            echo "No hay twg51.zip; se usan los archivos que ya están en el repo."
          fi

      # Deja en el repo el contenido descomprimido, para poder verlo y editarlo en GitHub.
      # Va antes de cualquier otro paso, así no se suben archivos generados.
      # La carpeta .github NO se actualiza sola: GitHub no deja que el workflow modifique
      # workflows (seguridad). Si cambia compilar.yml hay que pegarlo a mano.
      # "[skip ci]" evita que este commit vuelva a disparar la compilación.
      - name: Guardar lo descomprimido en el repo
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q -- .github || true
          if git diff --cached --quiet; then
            echo "El repo ya tenía este contenido; no hay nada que guardar."
          else
            git commit -q -m "Descomprimir twg51.zip [skip ci]"
            git push
            echo "Contenido de twg51.zip guardado en el repo."
          fi
          if ! git diff --quiet -- .github; then
            echo "::warning::El zip trae un compilar.yml distinto al del repo. Copialo a mano en .github/workflows/compilar.yml para usar la versión nueva."
          fi

      - name: Pruebas del script
        run: python3 -m unittest discover -s tests -v

      # El firmware (3 GB) se baja y se extrae una sola vez: lo extraído (~1 GB) se guarda
      # en la caché de GitHub. Solo se vuelve a bajar si cambia config/firmware.conf o
      # scripts/extraer_firmware.sh, o si la caché no se usó en 7 días (GitHub la borra).
      - name: Carpeta de trabajo
        run: |
          sudo mkdir -p /mnt/trabajo
          sudo chown "$(id -u):$(id -g)" /mnt/trabajo

      - name: Buscar firmware ya extraído (caché)
        id: cache_fw
        uses: actions/cache/restore@v4
        with:
          path: /mnt/trabajo/ext
          key: firmware-${{ hashFiles('config/firmware.conf', 'scripts/extraer_firmware.sh') }}

      - name: Liberar espacio en disco
        if: steps.cache_fw.outputs.cache-hit != 'true'
        run: bash scripts/liberar_espacio.sh

      - name: Instalar herramientas
        if: steps.cache_fw.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-libsparse-utils lz4 cpio xxd e2fsprogs erofs-utils unzip curl

      - name: Bajar el firmware de stock
        if: steps.cache_fw.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source config/firmware.conf
          if [ -n "${FIRMWARE_URL:-}" ]; then
            echo "Bajando desde config/firmware.conf"
            curl -L --fail --retry 3 -o /mnt/trabajo/firmware.zip "$FIRMWARE_URL"
          elif gh release download firmware -p firmware.zip -D /mnt/trabajo -R "$GITHUB_REPOSITORY"; then
            echo "Bajado del Release 'firmware'"
          else
            echo "::error::No hay firmware. Completá FIRMWARE_URL en config/firmware.conf o subí firmware.zip a un Release con etiqueta 'firmware'."
            exit 1
          fi
          ls -la /mnt/trabajo

      - name: Extraer kernel, vendor_boot y vendor
        if: steps.cache_fw.outputs.cache-hit != 'true'
        run: |
          bash scripts/extraer_firmware.sh /mnt/trabajo/firmware.zip /mnt/trabajo/ext
          # Para la caché solo se guarda lo que usa preparar_arbol.py.
          cd /mnt/trabajo/ext
          rm -rf fw herramientas particiones montaje boot_out vboot_out
          rm -f /mnt/trabajo/firmware.zip
          du -sh /mnt/trabajo/ext

      - name: Guardar firmware extraído en la caché
        if: steps.cache_fw.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /mnt/trabajo/ext
          key: ${{ steps.cache_fw.outputs.cache-primary-key }}

      - name: Firmware desde la caché
        if: steps.cache_fw.outputs.cache-hit == 'true'
        run: |
          echo "Se usó el firmware ya extraído de una compilación anterior (no se bajó de nuevo)."
          du -sh /mnt/trabajo/ext

      - name: Completar el device tree
        run: |
          python3 -I scripts/preparar_arbol.py \
            --vendor /mnt/trabajo/ext/vendor \
            --kernel /mnt/trabajo/ext/kernel \
            --vendor-ramdisk /mnt/trabajo/ext/vendor_ramdisk \
            --arbol "$RUTA_ARBOL" \
            --reporte reporte-firmware.md
          cat reporte-firmware.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar árbol preparado
        uses: actions/upload-artifact@v4
        with:
          name: arbol-cypfq
          path: ${{ env.RUTA_ARBOL }}
          include-hidden-files: true
          retention-days: 7

      - name: Guardar reporte
        uses: actions/upload-artifact@v4
        with:
          name: reporte-firmware
          path: reporte-firmware.md

  compilar:
    name: Compilar TWRP
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Bajar el repo
        uses: actions/checkout@v4

      - name: Descomprimir twg51.zip
        run: |
          if [ -f twg51.zip ]; then unzip -o twg51.zip -d .; fi

      - name: Liberar espacio en disco
        run: bash scripts/liberar_espacio.sh

      - name: Instalar dependencias de compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32z1-dev libelf-dev lz4 \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3 unzip
          # AOSP 12 todavía usa libncurses5 / libtinfo5 en algunas herramientas prearmadas.
          cd /tmp
          wget -q https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb && sudo dpkg -i libtinfo5_6.3-2_amd64.deb || true
          wget -q https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb && sudo dpkg -i libncurses5_6.3-2_amd64.deb || true
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "TWG51"
          git config --global user.email "twg51@users.noreply.github.com"

      - name: Bajar el código de TWRP (${{ env.RAMA_TWRP }})
        run: |
          sudo mkdir -p /mnt/twrp && sudo chown "$(id -u):$(id -g)" /mnt/twrp
          cd /mnt/twrp
          repo init --depth=1 -u "$MANIFIESTO" -b "$RAMA_TWRP" --git-lfs
          repo sync -c -j"$(nproc)" --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

      # ccache: guarda en la caché de GitHub los objetos ya compilados. Desde la segunda
      # compilación solo se recompila lo que cambió (la descarga del código no se puede ahorrar).
      - name: Restaurar ccache
        id: ccache_rest
        uses: actions/cache/restore@v4
        with:
          path: /mnt/ccache
          key: ccache-${{ env.RAMA_TWRP }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.RAMA_TWRP }}-

      - name: Configurar ccache
        run: |
          sudo mkdir -p /mnt/ccache && sudo chown "$(id -u):$(id -g)" /mnt/ccache
          export CCACHE_DIR=/mnt/ccache
          # 4 GB como máximo: la caché de GitHub es de 10 GB en total por repo
          # (también guarda el firmware extraído, ~1 GB).
          ccache -M 4G
          ccache -o compression=true
          ccache -o base_dir=/mnt/twrp
          ccache -z
          ccache -s

      - name: Traer el árbol preparado
        uses: actions/download-artifact@v4
        with:
          name: arbol-cypfq
          path: /mnt/twrp/${{ env.RUTA_ARBOL }}

      - name: Compilar
        run: |
          cd /mnt/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=/mnt/ccache
          set +u
          source build/envsetup.sh
          lunch twrp_${DISPOSITIVO}-eng
          mka bootimage -j"$(nproc)"

      - name: Estadísticas de ccache
        if: always()
        run: CCACHE_DIR=/mnt/ccache ccache -s || true

      # Se guarda aunque la compilación falle, así el próximo intento ya aprovecha lo compilado.
      - name: Guardar ccache
        if: always() && steps.ccache_rest.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: /mnt/ccache
          key: ccache-${{ env.RAMA_TWRP }}-${{ github.run_id }}

      - name: Renombrar resultado
        id: resultado
        run: |
          FECHA=$(date +%Y%m%d-%H%M)
          SALIDA=/mnt/twrp/out/target/product/$DISPOSITIVO
          mkdir -p resultado
          cp "$SALIDA/boot.img" "resultado/twrp-${DISPOSITIVO}-${FECHA}.img"
          sha256sum resultado/*.img > resultado/SHA256.txt
          echo "fecha=$FECHA" >> "$GITHUB_OUTPUT"
          ls -la resultado

      - name: Guardar imagen
        uses: actions/upload-artifact@v4
        with:
          name: twrp-cypfq-${{ steps.resultado.outputs.fecha }}
          path: resultado/

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: twrp-${{ steps.resultado.outputs.fecha }}
          name: TWRP G51 (cypfq) ${{ steps.resultado.outputs.fecha }}
          prerelease: true
          body: |
            TWRP para Moto G51 5G (cypfq) — fase 1 (sin descifrado). Creado por Andrés Londero.
            Probar SIEMPRE primero sin instalar:  fastboot boot twrp-cypfq-*.img
            Ver docs/PRUEBAS-EN-EL-TELEFONO.md
          files: resultado/*
