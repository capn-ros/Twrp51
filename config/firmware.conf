# TWG51 - TWRP para Motorola Moto G51 5G (cypfq)
# Creado por Andrés Londero
#
# Firmware de stock del que se saca el kernel, los módulos del táctil y el fstab.
#
# IMPORTANTE: tiene que ser EXACTAMENTE el mismo firmware que tiene el teléfono
# (Ajustes > Acerca del teléfono > Número de compilación). Si no coincide, el
# táctil y otros módulos no cargan.
#
# Dos formas de darle el firmware al workflow (usa la primera que encuentre):
#
#   1) URL directa al zip, acá abajo. Por ejemplo, del espejo de lolinet:
#      https://mirrors.lolinet.com/firmware/lenomola/2021/cypfq/official/
#      (entrar a la carpeta de tu canal, por ejemplo RETAIL, y copiar el enlace del zip
#       cuyo nombre tenga tu número de compilación).
#
#   2) Subir el zip como archivo de un Release de GitHub con la etiqueta "firmware"
#      y el nombre "firmware.zip" (los Releases aceptan archivos de hasta 2 GB).
#
# Teléfono de Andrés: XT2171-1, canal RETAR (Argentina), Android 12,
# número de compilación S2RYA32.58-13-12-5-6-1 (confirmado con captura, 2026-11-15).
# Zip de ~3 GB del espejo de lolinet.

